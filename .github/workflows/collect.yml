name: Raccogli notizie e pubblica

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: salento-oggi
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test del raccoglitore
        run: python -m unittest discover -s collector/tests -t .

      - name: Test dell'app
        run: node --test app/tests/*.test.js

      - name: Raccogli le notizie
        run: python -m collector.pipeline

      - name: Salva news.json se è cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/news.json
          if git diff --cached --quiet; then
            echo "news.json invariato"
          else
            git commit -m "data: aggiorna le notizie"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Versiona il service worker e imposta l'indirizzo del sito
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          export SITE_URL="${SITE_URL:-https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}}"
          python -m scripts.stamp

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
